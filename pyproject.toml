[project]
name = "atendimento-ao-cliente"
version = "0.1.0"
description = "Agente de atendimento ao cliente Gocase / GoBeauté (GoHacks Talent 2026)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "slack-bolt>=1.30.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not llm and not postgres'"
markers = [
    "integracao: lê a base real em docs/ (somente leitura)",
    "llm: chama a API da Anthropic de verdade (rodar com -m llm; precisa de ANTHROPIC_API_KEY)",
    "postgres: roda contra o Neon (rodar com -m postgres; precisa de DATABASE_URL no .env.local)",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", "graphify-out", ".scratch", "ingestao/markdown", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # comprimento fica com o ruff format

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atendimento"]
